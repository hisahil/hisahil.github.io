roke-linejoin="round" class="lucide lucide-arrow-down" aria-hidden="true"><path d="M12 5v14"></path><path d="m19 12-7 7-7-7"></path></svg></button></div></div><span class="sr-only" role="status" aria-live="polite"></span></div><span class="site-copyright">Sahil © 2026</span><footer class="site-footer"><button class="sound-toggle" data-sound-control="true" aria-label="Robot sound" aria-pressed="true" title="Sound is on; playback begins after your first interaction"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-volume2 lucide-volume-2" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"></path><path d="M16 9a5 5 0 0 1 0 6"></path><path d="M19.364 18.364a9 9 0 0 0 0-12.728"></path></svg><span>Sound on</span></button><button>Text view<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right" aria-hidden="true"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></button></footer><noscript><section class="noscript-content"><h2>The portfolio</h2><article><h3>A bit about me...</h3><div class="about-layout"><div class="entries"><article class="entry"><h3>Sahil</h3><p class="organisation">London, United Kingdom</p><p>I am an MSc Machine Learning student at UCL and an incoming research intern at the University of Cambridge. My academic background is in electrical engineering, with a specialisation in robotics and automation.</p><p>My research interests span ML and robotics, with a particular focus on AI safety, LLM reasoning, robotics, and world models. Generally speaking, I am excited to contribute to technically ambitious research that is both impactful AND (!) beneficial to society.</p><p>If you do not have much time on your hands below is a brief overview of some of my accomplishments/highlights.</p></article></div><div class="about-photo"><img alt="Portrait of Sahil" width="930" height="1024" decoding="async" data-nimg="1" style="color:transparent" src="/sahil-portrait.jpg"/></div></div><section class="highlight-block" aria-labelledby="about-highlights"><h3 id="about-highlights">Highlights / Accomplishments</h3><ul><li>Incoming Research Intern, University of Cambridge</li><li>Winner (1 of 15), 18th German American Conference Essay Competition at Harvard</li><li>Invited Speaker at Imperial College London with Google DeepMind Scholar Mirgahney Mohamed</li><li>Featured in local media (HAZ) for leadership and civic engagement</li><li>Third place from 700+ applicants, UCL Agentverse Agent Hackathon, including a visit to Cisco’s office</li><li>Selected as one of 50 from 1,000+ applicants, Entrepreneurs First × Saturn Agent Hackathon</li><li>Raised more than €42,000 for charitable causes</li><li>Top 5% applicant for the ETH Summer Research Programme</li><li>Deutschlandstiftung Integration Scholar (Geh deinen Weg)</li><li>Bain &amp; Company Engineering Scholarship (one of four recipients)</li><li>Avicenna Scholar (5–8% acceptance rate)</li><li>Selected Student Ambassador, AE Global Summit on Open Problems for AI</li><li>Selected for the AI Ethics &amp; Governance programme at the German Research Center for Artificial Intelligence</li><li>BSc Electrical Engineering, specialising in Automation, AI and Robotics (top 6.5%)</li></ul></section></article><article><h3>Education</h3><div class="entries"><article class="entry"><h3>MSc Machine Learning</h3><p class="organisation">University College London</p><p>Graduate study in machine learning, with interests spanning probabilistic modelling, reinforcement learning, generative models, responsible AI and intelligent systems.</p></article><article class="entry"><h3>BSc Electrical Engineering</h3><p class="organisation">Specialisation in Automation, AI and Robotics</p><p>Built a rigorous engineering foundation across automation, artificial intelligence and robotics, graduating within the top 6.5% of the cohort.</p></article><article class="entry"><h3>Summer School</h3><p class="organisation">University of Cambridge</p><p>An academic summer programme at the University of Cambridge.</p></article></div></article><article><h3>Experience</h3><div class="entries"><article class="entry"><h3>Incoming Research Intern</h3><p class="organisation">University of Cambridge</p><p>Joining the University of Cambridge for a research internship in machine learning and intelligent systems.</p></article><article class="entry"><h3>Student Fellow</h3><p class="organisation">Thinking About Thinking</p><p>Support student access to programmes connecting emerging researchers with leading work across artificial intelligence, science and technology.</p></article><article class="entry"><h3>AI Intern (Computer Vision &amp; Defect Detection)</h3><p class="organisation">MEKO GLOBAL</p><p>Developed and tuned computer-vision models for automated defect detection under real production constraints. Led dataset curation and systematic hyperparameter optimisation, then worked with engineers to integrate trained models into production workflows.</p><div class="tags"><span>Computer vision</span><span>Model optimisation</span><span>Industrial AI</span></div></article><article class="entry"><h3>AI Ethics and Governance Fellow</h3><p class="organisation">German Research Center for Artificial Intelligence (DFKI)</p><p>Selected for a programme exploring the ethical and governance challenges surrounding artificial intelligence.</p></article><article class="entry"><h3>Tutor (Electrical Machines &amp; Electromagnetic Conversion)</h3><p class="organisation">Leibniz University Hannover</p></article><article class="entry"><h3>Tutor (Engineering Mechanics)</h3><p class="organisation">Leibniz University Hannover</p></article></div></article><article><h3>Research</h3><div class="entries"><article class="entry"><h3>3D Vision Research Presentation</h3><p class="organisation">Imperial College London</p><p>Invited to present research at Imperial College London together with Google DeepMind Scholar Mirgahney Mohamed, followed by discussion with the academic community.</p></article></div></article><article><h3>Projects</h3><div class="entries"><article class="entry"><h3>Multi-Agent PR Crisis Management</h3><p class="organisation">HackEurope · CentraleSupélec, Paris</p><p>Built a multi-agent pipeline that helps organisations respond to coordinated disinformation and emerging PR crises in seconds rather than days.</p><div class="tags"><span>Multi-agent systems</span><span>Disinformation analysis</span><span>Crisis intelligence</span></div></article><article class="entry"><h3>Social-Signal Intelligence &amp; Autonomous Trading Stack</h3><p class="organisation">Entrepreneurs First × Saturn Agent Hackathon</p><p>Created an auditable platform that extracts market narratives from historical social data and coordinates specialised director, quant, risk and execution agents. The system supports both autonomous execution and human review.</p><div class="tags"><span>AI agents</span><span>Social intelligence</span><span>Quantitative analysis</span><span>Risk controls</span></div></article><article class="entry"><h3>EQIP.ai</h3><p class="organisation">UCL Agentverse Hackathon</p><p>Built an MVP for agentic intellectual-property management within 48 hours. The workflow combines information retrieval, automated contracts, blockchain traceability and transparent contribution ownership for complex collaborations.</p><div class="tags"><span>Agentic AI</span><span>Information retrieval</span><span>Blockchain</span><span>Contract automation</span></div></article></div></article><article><h3>Voluntary Work</h3><div class="entries"><article class="entry"><h3>Social Media Strategist</h3><p class="organisation">UNICEF</p></article><article class="entry"><h3>Delegate</h3><p class="organisation">Young European Symposium</p></article><article class="entry"><h3>Campaign Manager</h3><p class="organisation">Amnesty International</p></article><article class="entry"><h3>Head of Fundraising</h3><p class="organisation">Avicenna-Studienwerk</p></article><article class="entry"><h3>Tutor</h3><p class="organisation">Lern-Fair</p></article></div></article><article><h3>Awards</h3><div class="entries"><article class="entry"><h3>Mentoring Program PoliMatch</h3><p class="organisation">Generation Postmigration e.V.</p><p>Selected as a mentee for a competitive programme run by Generation Postmigration e.V. that identifies people from marginalised communities with strong leadership potential and connects them with experienced politicians and public administrators. Sessions have included a discussion with Belit Onay, Mayor of Hanover, on political leadership and public office. Selection was featured in the newspaper Hannoversche Allgemeine Zeitung.</p><a class="project-link" href="https://www.haz.de/lokales/hannover/hannover-verein-generation-postmigration-sucht-mit-polimatch-nachwuchs-fuer-politik-CI7SJYQAJRCPZDDQZ627GVIJNQ.html" target="_blank" rel="noopener noreferrer">Read the HAZ article<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right" aria-hidden="true"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></a></article><article class="entry"><h3>Selected Student Ambassador</h3><p class="organisation">AE Global Summit on Open Problems for AI · Thinking About Thinking</p><p>Selected as a Student Ambassador for the summit, which brings together researchers from Google DeepMind, Oxford, Princeton, UCL and NVIDIA to explore open problems in AI.</p></article><article class="entry"><h3>Winner (18th German American Conference Essay Competition)</h3><p class="organisation">German American Conference at Harvard</p><p>Selected as one of 15 winners of the conference essay competition.</p><a class="project-link" href="https://germanamericanconference.org/essay-competition/" target="_blank" rel="noopener noreferrer">German American Conference Essay Competition<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right" aria-hidden="true"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></a></article><article class="entry"><h3>3rd Place (Agentverse Hackathon)</h3><p class="organisation">UCL Artificial Intelligence Society</p><p>Placed third after being selected from a pool of more than 700 applicants; the result included a visit to Cisco’s office.</p></article><article class="entry"><h3>Top 50 Selection (Agent Hackathon)</h3><p class="organisation">Entrepreneurs First × Saturn</p><p>Selected as one of 50 participants from more than 1,000 applicants.</p></article><article class="entry"><h3>Top 5% Applicant</h3><p class="organisation">ETH Summer Research Programme</p><p>Recognised among the top five percent of applicants to the summer research programme.</p></article></div></article><article><h3>Scholarships</h3><div class="entries"><article class="entry"><h3>e-fellows.net Scholarship</h3><p class="organisation">e-fellows.net</p></article><article class="entry"><h3>Nomination for the Studienstiftung des deutschen Volkes Scholarship</h3><p class="organisation">Studienstiftung des deutschen Volkes</p></article><article class="entry"><h3>Geh deinen Weg Scholar</h3><p class="organisation">Deutschlandstiftung Integration</p><p>Selected for a mentoring and development programme connecting talented young people with leaders across politics, business, media, culture and science.</p></article><article class="entry"><h3>Engineering Scholarship</h3><p class="organisation">Bain &amp; Company</p><p>One of four recipients selected for the Bain &amp; Company Engineering Scholarship.</p></article><article class="entry"><h3>Netzwerk Chancen</h3><p class="organisation">Netzwerk Chancen</p><p>Netzwerk Chancen is a German organization supporting young talents from disadvantaged socioeconomic backgrounds through mentorship, networking opportunities and skill development. It empowers members to build successful careers and promotes equal opportunities in the professional world.</p></article><article class="entry"><h3>Avicenna Scholar</h3><p class="organisation">Avicenna-Studienwerk</p><p>Selected for the Avicenna scholarship programme, with a reported acceptance rate of approximately 5–8%.</p></article></div></article><article><h3>Trivia</h3><div class="entries"><article class="entry"><h3>Languages</h3><p>I speak English, German, Urdu, Punjabi, Hindi and Spanish.</p></article><article class="entry"><h3>Countries I have visited...</h3><p>Spain, France, UK, Ireland, Belgium, the Netherlands, Turkey, Norway, Saudi Arabia, Qatar and UAE, among others.</p></article><article class="entry"><h3>These are some of my favorite books....</h3><ul class="book-list"><li><strong>Atomic Habits</strong> by <!-- -->James Clear</li><li><strong>Zero to One</strong> by <!-- -->Peter Thiel</li><li><strong>Seven Powers</strong> by <!-- -->Hamilton Helmer</li></ul></article></div></article></section></noscript></main><!--$--><!--/$--><script src="/_next/static/chunks/webpack-aa45520b7ad2bf25.js" id="_R_" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0])</script><script>self.__next_f.push([1,"1:\"$Sreact.fragment\"\n2:I[7121,[],\"\"]\n3:I[4581,[],\"\"]\n4:I[708,[\"994\",\"static/chunks/994-08b75cf85379a61c.js\",\"974\",\"static/chunks/app/page-9ad20345bf87170c.js\"],\"default\"]\n5:I[484,[],\"OutletBoundary\"]\n6:\"$Sreact.suspense\"\n8:I[484,[],\
